<!doctype html>
<html lang="de">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <title>CityTrip – Finde dein Reiseziel</title>
        <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
        <meta name="theme-color" content="#0a0d15">
        <meta property="og:title" content="CityTrip – Finde dein perfektes Reiseziel">
        <meta property="og:description" content="Entdecke durch 20 Klicks die Stadt, die deinen Wünschen entspricht!">
        <meta property="og:image" content="{{ request.host_url }}static/start.png">
        <meta property="og:type" content="website">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
        <link rel="stylesheet" href="/static/theme.css">
        <style>
            html, body {
                overflow-x: hidden;
            }

            body {
                min-height: 100vh;
                min-height: 100dvh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                text-align: center;
                padding: 2rem 1.25rem;
                position: relative;
            }

            /* ── Schwebende Stadt-Karten ────────────────────────── */
            .float-stage {
                position: absolute;
                inset: 0;
                pointer-events: none;
                z-index: 0;
            }

            .float-card {
                position: absolute;
                width: clamp(86px, 24vw, 150px);
                aspect-ratio: 3 / 4;
                border-radius: 18px;
                overflow: hidden;
                border: 1px solid rgba(255, 255, 255, 0.16);
                box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
                animation: floaty 7s ease-in-out infinite alternate;
                opacity: 0.9;
            }

            .float-card img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
            }

            .float-card::after {
                content: attr(data-city);
                position: absolute;
                left: 0; right: 0; bottom: 0;
                padding: 1.4rem 0.6rem 0.5rem;
                font-family: var(--font-display);
                font-size: 0.68rem;
                font-weight: 700;
                color: #fff;
                background: linear-gradient(to top, rgba(0,0,0,0.75), transparent);
            }

            .fc-1 { top: 6%;  left: -2%;  rotate: -8deg; animation-delay: 0s;    }
            .fc-2 { top: 3%;  right: -3%; rotate: 7deg;  animation-delay: -2.2s; }
            .fc-3 { bottom: 13%; left: -4%; rotate: 6deg;  animation-delay: -4s; }
            .fc-4 { bottom: 10%; right: -4%; rotate: -7deg; animation-delay: -1.4s; }

            @keyframes floaty {
                from { transform: translateY(-9px); }
                to   { transform: translateY(11px); }
            }

            @media (prefers-reduced-motion: reduce) {
                .float-card { animation: none; }
            }

            /* Auf großen Screens rücken die Karten näher an die Mitte */
            @media (min-width: 900px) {
                .fc-1 { top: 12%; left: 12%; }
                .fc-2 { top: 10%; right: 12%; }
                .fc-3 { bottom: 16%; left: 15%; }
                .fc-4 { bottom: 14%; right: 15%; }
            }

            /* ── Hero-Inhalt ────────────────────────────────────── */
            .hero {
                position: relative;
                z-index: 1;
                display: flex;
                flex-direction: column;
                align-items: center;
                max-width: 720px;
            }

            .hero .chip {
                margin-bottom: 1.4rem;
            }

            .chip .plane {
                display: inline-block;
                animation: planeWiggle 3s ease-in-out infinite;
            }

            @keyframes planeWiggle {
                0%, 100% { transform: translateX(0) rotate(0deg); }
                50%      { transform: translateX(4px) rotate(8deg); }
            }

            .main-title {
                color: var(--text);
                font-size: clamp(2.3rem, 9.5vmin, 4.2rem);
                font-weight: 800;
                line-height: 1.08;
                margin-bottom: 1.2rem;
            }

            .description-text {
                color: var(--text-dim);
                font-size: clamp(1rem, 2.6vmin, 1.15rem);
                font-weight: 300;
                line-height: 1.65;
                max-width: 34rem;
                margin-bottom: 2.2rem;
            }

            .description-text b {
                color: var(--text);
                font-weight: 600;
            }

            /* ── CTA ────────────────────────────────────────────── */
            .button-group {
                display: flex;
                gap: 0.9rem;
                justify-content: center;
                align-items: center;
                margin-bottom: 2.8rem;
            }

            .btn-start {
                padding: 1.15rem 3rem;
                font-size: clamp(1.1rem, 3.4vw, 1.3rem);
                position: relative;
            }

            .btn-start::after {
                content: '';
                position: absolute;
                inset: -4px;
                border-radius: 99px;
                border: 2px solid rgba(255, 87, 51, 0.45);
                animation: ctaPulse 2.2s ease-out infinite;
                pointer-events: none;
            }

            @keyframes ctaPulse {
                0%   { transform: scale(1);    opacity: 1; }
                70%  { transform: scale(1.18); opacity: 0; }
                100% { transform: scale(1.18); opacity: 0; }
            }

            .btn-start .arrow {
                transition: transform 0.25s ease;
            }

            .btn-start:hover .arrow { transform: translateX(4px); }

            /* ── Stats ──────────────────────────────────────────── */
            .stats-row {
                display: flex;
                align-items: stretch;
                gap: 0;
                padding: 1rem 0.5rem;
                width: min(100%, 26rem);
            }

            .stat {
                flex: 1;
                display: flex;
                flex-direction: column;
                gap: 0.15rem;
                padding: 0 0.75rem;
            }

            .stat + .stat {
                border-left: 1px solid var(--border);
            }

            .stat-num {
                font-family: var(--font-display);
                font-size: clamp(1.5rem, 6vmin, 2.1rem);
                font-weight: 800;
                background: var(--grad-brand);
                -webkit-background-clip: text;
                background-clip: text;
                -webkit-text-fill-color: transparent;
            }

            .stat-label {
                color: var(--text-faint);
                font-size: clamp(0.68rem, 1.9vmin, 0.8rem);
                font-weight: 500;
                text-transform: uppercase;
                letter-spacing: 0.08em;
            }

            /* ── Kontakt-Modal ──────────────────────────────────── */
            #contact-overlay {
                display: none;
                position: fixed;
                inset: 0;
                background: rgba(5, 7, 12, 0.75);
                backdrop-filter: blur(8px);
                -webkit-backdrop-filter: blur(8px);
                z-index: 1000;
                justify-content: center;
                align-items: center;
                padding: 1.5rem;
            }

            .contact-card {
                background: var(--surface-solid);
                border: 1px solid var(--border-strong);
                border-radius: var(--radius-md);
                padding: 2rem;
                max-width: 320px;
                width: 100%;
                text-align: left;
                box-shadow: var(--shadow-card);
                animation: riseIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) both;
            }

            .contact-card h2 {
                margin-bottom: 1.2rem;
                font-size: 1.3rem;
            }

            .contact-card p {
                color: var(--text-dim);
                line-height: 1.8;
            }

            .contact-card strong { color: var(--text); }

            .close-btn {
                display: inline-block;
                margin-top: 1.5rem;
                color: var(--text-faint);
                cursor: pointer;
                text-decoration: underline;
                font-size: 0.9rem;
            }
        </style>
    </head>
    <body>
        <div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>

        <div class="float-stage" aria-hidden="true">
            <div class="float-card fc-1 rise rise-1" data-city="Paris"><img src="/static/Alle_Stadt_Bilder_neu/Paris.jpg" alt=""></div>
            <div class="float-card fc-2 rise rise-2" data-city="Bangkok"><img src="/static/Alle_Stadt_Bilder_neu/Bangkok.jpg" alt=""></div>
            <div class="float-card fc-3 rise rise-3" data-city="Rome"><img src="/static/Alle_Stadt_Bilder_neu/Rome.jpg" alt=""></div>
            <div class="float-card fc-4 rise rise-4" data-city="Barcelona"><img src="/static/Alle_Stadt_Bilder_neu/Barcelona.jpg" alt=""></div>
        </div>

        <main class="hero">
            <span class="chip rise"><span class="plane">✈️</span> CityTrip</span>

            <h1 class="main-title rise rise-1">
                Finde dein<br><span class="grad-text">perfektes Reiseziel</span>
            </h1>

            <p class="description-text rise rise-2">
                Traumurlaub, Auslandssemester oder Wochenendtrip?
                Swipe dich durch Städte aus aller Welt – nach
                <b>20&nbsp;Swipes</b> kennen wir die Stadt, die zu dir passt.
            </p>

            <div class="button-group rise rise-3">
                <a href="/quiz" class="btn-primary btn-start">Los geht's <span class="arrow">→</span></a>
                <button class="btn-icon" onclick="toggleContact()" aria-label="Kontakt">
                    <span class="material-icons">mail</span>
                </button>
            </div>

            <div class="stats-row glass rise rise-4">
                <div class="stat">
                    <span class="stat-num" data-count="190">0</span>
                    <span class="stat-label">Städte</span>
                </div>
                <div class="stat">
                    <span class="stat-num" data-count="20">0</span>
                    <span class="stat-label">Swipes</span>
                </div>
                <div class="stat">
                    <span class="stat-num" data-count="1">0</span>
                    <span class="stat-label">Match</span>
                </div>
            </div>
        </main>

        <div id="contact-overlay" onclick="toggleContact()">
            <div class="contact-card" onclick="event.stopPropagation()">
                <h2>Kontakt</h2>
                <p><strong>Name:</strong> Jonas Knorr</p>
                <p><strong>E-Mail:</strong> knorr-jonas@gmx.de</p>
                <span class="close-btn" onclick="toggleContact()">Schließen</span>
            </div>
        </div>

        <script>
            function toggleContact() {
                const overlay = document.getElementById('contact-overlay');
                const isVisible = overlay.style.display === 'flex';
                overlay.style.display = isVisible ? 'none' : 'flex';
            }

            /* Count-up der Statistiken */
            (function () {
                document.querySelectorAll('.stat-num').forEach(function (el) {
                    const target = parseInt(el.dataset.count, 10);
                    const dur = 1200;
                    const t0 = performance.now() + 500; // nach den Einblendungen
                    function tick(now) {
                        const p = Math.min(Math.max((now - t0) / dur, 0), 1);
                        const eased = 1 - Math.pow(1 - p, 3);
                        el.textContent = Math.round(eased * target);
                        if (p < 1) requestAnimationFrame(tick);
                    }
                    requestAnimationFrame(tick);
                });
            })();
        </script>
    </body>
</html>
