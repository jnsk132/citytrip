<!doctype html>
<html lang="de">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
        <title>Quiz – CityTrip</title>
        <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
        <meta name="theme-color" content="#0a0d15">
        <meta property="og:title" content="CityTrip – Finde dein perfektes Reiseziel">
        <meta property="og:description" content="Entdecke durch 20 Klicks die Stadt, die deinen Wünschen entspricht!">
        <meta property="og:image" content="{{ request.host_url }}static/start.png">
        <meta property="og:type" content="website">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="/static/theme.css">
        <style>
            body {
                height: 100vh;
                height: 100dvh;
                overflow: hidden;
                touch-action: none;
                position: relative;
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            /* ── Ambient: unscharfes Stadtbild im Hintergrund ───── */
            .ambient-wrap {
                position: fixed;
                inset: 0;
                z-index: -1;
                overflow: hidden;
                background: var(--bg);
            }

            #bgAmbient {
                width: 100%;
                height: 100%;
                object-fit: cover;
                filter: blur(60px) saturate(1.4) brightness(0.55);
                transform: scale(1.3);
                opacity: 0.55;
                transition: opacity 0.4s ease;
            }

            .ambient-wrap::after {
                content: '';
                position: absolute;
                inset: 0;
                background: linear-gradient(to bottom, rgba(10,13,21,0.82), rgba(10,13,21,0.45) 45%, rgba(10,13,21,0.88));
            }

            /* ── Header ─────────────────────────────────────────── */
            .header-container {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 100%;
                max-width: 560px;
                padding: calc(env(safe-area-inset-top, 0px) + 1rem) 1.25rem 0;
                position: relative;
            }

            .return-button {
                position: absolute;
                left: 1.25rem;
                width: 2.6rem;
                height: 2.6rem;
                font-size: 1rem;
            }

            .top-text {
                font-size: 1.25rem;
                font-weight: 800;
                margin: 0;
            }

            .top-text .plane { font-size: 1rem; }

            /* ── Progress ───────────────────────────────────────── */
            .progress-container {
                width: min(88%, 480px);
                margin-top: 1.1rem;
            }

            .progress-bar-text {
                text-align: right;
                margin-bottom: 0.45rem;
                font-size: 0.82rem;
                font-weight: 600;
                color: var(--text-dim);
                font-variant-numeric: tabular-nums;
                letter-spacing: 0.05em;
            }

            .progress-wrapper {
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 99px;
                height: 9px;
                width: 100%;
                overflow: hidden;
            }

            .progress-bar-fill {
                height: 100%;
                background: var(--grad-brand);
                border-radius: 99px;
                box-shadow: 0 0 14px rgba(255, 87, 51, 0.7);
                transition: width 0.45s cubic-bezier(0.16, 1, 0.3, 1);
            }

            /* ── Karten-Stack ───────────────────────────────────── */
            .main-content {
                margin-top: clamp(1rem, 3.5vh, 2.25rem);
                position: relative;
                display: flex;
                justify-content: center;
                flex: 1;
                min-height: 0;
                width: 100%;
            }

            .deck {
                position: relative;
                width: fit-content;
                height: fit-content;
                margin: 0 auto;
            }

            .deck-card {
                position: absolute;
                inset: 0;
                border-radius: var(--radius-lg);
                background: var(--surface-2);
                border: 1px solid var(--border);
                backdrop-filter: blur(8px);
                -webkit-backdrop-filter: blur(8px);
                pointer-events: none;
            }

            .deck-card.d1 { transform: translateY(14px) scale(0.955); opacity: 0.8; }
            .deck-card.d2 { transform: translateY(27px) scale(0.91);  opacity: 0.45; }

            .img-wrapper {
                position: relative;
                width: fit-content;
                border-radius: var(--radius-lg);
                overflow: hidden;
                user-select: none;
                -webkit-user-select: none;
                border: 1px solid rgba(255, 255, 255, 0.14);
                box-shadow: var(--shadow-card);
                /* Karten-Animation */
                transition: transform 0.25s ease, opacity 0.25s ease;
                will-change: transform, opacity;
                z-index: 2;
            }

            .img-wrapper.dragging { transition: none; }

            .cropped_img {
                width: min(88vw, 420px);
                height: min(62vh, 640px);
                min-height: 180px;
                object-fit: cover;
                object-position: center;
                display: block;
                pointer-events: none;
            }

            /* ── LIKE / NOPE Stempel ────────────────────────────── */
            .swipe-hint {
                position: absolute;
                top: 1.6rem;
                font-family: var(--font-display);
                font-size: clamp(1.5rem, 6vmin, 2.2rem);
                font-weight: 800;
                letter-spacing: 0.12em;
                padding: 0.2rem 0.9rem;
                border-radius: 12px;
                border: 4px solid;
                opacity: 0;
                transition: opacity 0.12s ease;
                pointer-events: none;
                z-index: 10;
                text-transform: uppercase;
                backdrop-filter: blur(2px);
                -webkit-backdrop-filter: blur(2px);
            }

            .swipe-hint.like {
                left: 1.4rem;
                color: var(--like);
                border-color: var(--like);
                transform: rotate(-14deg);
                text-shadow: 0 0 18px rgba(0, 229, 160, 0.6);
            }

            .swipe-hint.dislike {
                right: 1.4rem;
                color: var(--dislike);
                border-color: var(--dislike);
                transform: rotate(14deg);
                text-shadow: 0 0 18px rgba(255, 77, 109, 0.6);
            }

            .gradient-overlay {
                position: absolute;
                bottom: 0; left: 0; right: 0;
                height: 45%;
                background: linear-gradient(to top, rgba(5, 7, 12, 0.92) 0%, transparent 100%);
                pointer-events: none;
            }

            .text-overlay {
                position: absolute;
                bottom: 1.4rem;
                left: 0;
                right: 0;
                text-align: center;
                pointer-events: none;
                padding: 0 1rem;
            }

            .city_text {
                font-size: clamp(1.7rem, 7vmin, 2.6rem);
                font-weight: 800;
                margin: 0;
                color: #fff;
                line-height: 1.1;
                text-shadow: 0 2px 18px rgba(0, 0, 0, 0.6);
            }

            .country_text {
                font-size: clamp(0.95rem, 3.4vmin, 1.2rem);
                margin: 0.25rem 0 0;
                color: rgba(255, 255, 255, 0.78);
                font-weight: 500;
                letter-spacing: 0.04em;
            }

            /* ── Buttons ────────────────────────────────────────── */
            .button-container {
                display: flex;
                justify-content: center;
                align-items: center;
                gap: clamp(2.2rem, 9vw, 4rem);
                margin-top: clamp(1.1rem, 2.6vh, 2.2rem);
                padding-bottom: max(1.6rem, env(safe-area-inset-bottom, 1rem) + 1rem);
            }

            .button {
                display: flex;
                justify-content: center;
                align-items: center;
                border: none;
                font-size: clamp(1.7rem, 7.5vmin, 2.4rem);
                border-radius: 50%;
                height: clamp(64px, 17vmin, 92px);
                width: clamp(64px, 17vmin, 92px);
                cursor: pointer;
                transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease;
                -webkit-tap-highlight-color: transparent;
            }

            .button:active { transform: scale(0.88); }

            @media (hover: hover) {
                .button:hover { transform: translateY(-6px) scale(1.06); }
                .button:hover:active { transform: scale(0.88); }
            }

            .dislike-button {
                background: rgba(255, 77, 109, 0.12);
                border: 2px solid rgba(255, 77, 109, 0.55);
                color: var(--dislike);
                backdrop-filter: blur(12px);
                -webkit-backdrop-filter: blur(12px);
                box-shadow: 0 10px 32px rgba(255, 77, 109, 0.25);
            }

            .like-button {
                background: linear-gradient(135deg, #00e5a0, #00b88f);
                color: #03281d;
                box-shadow: 0 10px 36px rgba(0, 229, 160, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.35);
            }

            .swipe-tip {
                position: absolute;
                bottom: calc(clamp(64px, 17vmin, 92px) + max(1.6rem, 2.6rem) + 0.75rem);
                left: 50%;
                transform: translateX(-50%);
                z-index: 20;
                color: var(--text-dim);
                font-size: clamp(0.85rem, 2.8vmin, 1rem);
                font-weight: 500;
                text-align: center;
                line-height: 1.6;
                text-shadow: 0 1px 6px rgba(0, 0, 0, 0.6);
                pointer-events: none;
                white-space: nowrap;
                transition: opacity 0.5s ease;
            }

            @keyframes swipeHint {
                0%   { transform: translateX(0) rotate(0deg); }
                20%  { transform: translateX(-18px) rotate(-2deg); }
                50%  { transform: translateX(18px) rotate(2deg); }
                80%  { transform: translateX(-10px) rotate(-1deg); }
                100% { transform: translateX(0) rotate(0deg); }
            }

            .img-wrapper.hint-anim {
                animation: swipeHint 0.7s ease-in-out;
            }

            /* ── Querformat auf Handys ──────────────────────────── */
            @media (orientation: landscape) and (max-height: 600px) {
                body {
                    height: auto;
                    min-height: 100vh;
                    overflow-y: auto;
                    touch-action: auto;
                }

                .header-container { padding-top: 0.75rem; }
                .progress-container { margin-top: 0.5rem; }
                .main-content { margin-top: 0.75rem; flex: none; }
                .cropped_img { height: 44vh; }
                .button-container { margin-top: 0.75rem; padding-bottom: 1rem; }
                .swipe-tip { margin-top: 0.25rem; }
            }

            #swipeColor {
                position: absolute;
                inset: 0;
                pointer-events: none;
                z-index: 6;
                opacity: 0;
            }

            /* ── Ergebnis-Loader ────────────────────────────────── */
            #resultOverlay {
                position: fixed;
                inset: 0;
                background: rgba(8, 10, 17, 0.88);
                backdrop-filter: blur(24px);
                -webkit-backdrop-filter: blur(24px);
                z-index: 200;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                text-align: center;
                padding: 2rem;
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.4s ease;
            }

            #resultOverlay.active {
                opacity: 1;
                pointer-events: all;
            }

            .loader-ring {
                position: relative;
                width: clamp(84px, 22vmin, 120px);
                height: clamp(84px, 22vmin, 120px);
                margin-bottom: 2.2rem;
            }

            .loader-ring::before {
                content: '';
                position: absolute;
                inset: 0;
                border-radius: 50%;
                background: conic-gradient(from 0deg, transparent 10%, #ff7a18 55%, #ff2e63 100%);
                -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 7px), #000 calc(100% - 6px));
                mask: radial-gradient(farthest-side, transparent calc(100% - 7px), #000 calc(100% - 6px));
                animation: spin 1.3s linear infinite;
            }

            .loader-ring .plane {
                position: absolute;
                inset: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: clamp(2rem, 8vmin, 2.8rem);
            }

            @keyframes spin {
                from { transform: rotate(0deg); }
                to   { transform: rotate(360deg); }
            }

            .loader-headline {
                font-family: var(--font-display);
                font-size: clamp(1.25rem, 4.2vmin, 1.7rem);
                font-weight: 800;
                color: var(--text);
                margin-bottom: 0.6rem;
            }

            .loader-status {
                font-size: clamp(0.85rem, 2.5vmin, 1rem);
                color: var(--text-faint);
                margin-bottom: 2.5rem;
                min-height: 1.4em;
                transition: opacity 0.45s ease-in-out;
            }

            .loader-bar-track {
                width: min(80vw, 340px);
                height: 7px;
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 99px;
                overflow: hidden;
            }

            .loader-bar-fill {
                height: 100%;
                width: 0%;
                background: var(--grad-brand);
                border-radius: 99px;
                box-shadow: 0 0 14px rgba(255, 87, 51, 0.7);
                transition: width 0.6s ease;
            }
        </style>
    </head>
    <body>
        <div class="ambient-wrap" aria-hidden="true">
            <img id="bgAmbient" src="{{ file_path }}" alt="">
        </div>

        <!-- Lade-Overlay -->
        <div id="resultOverlay">
            <div class="loader-ring">
                <span class="plane">✈️</span>
            </div>
            <p class="loader-headline">Berechne dein perfektes Reiseziel</p>
            <p class="loader-status" id="loaderStatus">Starte Analyse...</p>
            <div class="loader-bar-track">
                <div class="loader-bar-fill" id="loaderBar"></div>
            </div>
        </div>

        <header class="header-container rise">
            <a href="/" class="return-button btn-icon" aria-label="Zurück zur Startseite">
                <i class="fa fa-arrow-left"></i>
            </a>
            <h1 class="top-text">City<span class="grad-text">Trip</span></h1>
        </header>

        <div class="progress-container rise rise-1">
            <p class="progress-bar-text" id="progressText">{{ iteration }} / 20</p>
            <div class="progress-wrapper">
                <div class="progress-bar-fill" id="progressFill"
                     style="width: calc(({{ iteration }} / 20) * 100%);"></div>
            </div>
        </div>

        <main class="main-content rise rise-2">
            <div class="deck">
                <div class="deck-card d2"></div>
                <div class="deck-card d1"></div>

                <div class="img-wrapper" id="imgWrapper">
                    <img class="cropped_img" id="cityImg" src="{{ file_path }}" alt="Stadtbild" draggable="false">

                    <div id="swipeColor"></div>

                    <span class="swipe-hint like"    id="hintLike">Like</span>
                    <span class="swipe-hint dislike" id="hintDislike">Nope</span>

                    <div class="gradient-overlay"></div>

                    <div class="text-overlay">
                        <h1 class="city_text"    id="cityName">{{ city_name }}</h1>
                        <p  class="country_text" id="countryName">{{ country_name }}</p>
                    </div>
                </div>
            </div>
        </main>

        <p class="swipe-tip" id="swipeTip">← Swipen oder Buttons nutzen →</p>

        <footer class="button-container rise rise-3">
            <button class="button dislike-button" id="dislikeBtn" onclick="submitChoice('dislike')" aria-label="Gefällt mir nicht">
                <i class="fa fa-times"></i>
            </button>
            <button class="button like-button" id="likeBtn" onclick="submitChoice('like')" aria-label="Gefällt mir">
                <i class="fa fa-heart"></i>
            </button>
        </footer>

<script>
            const swipeColor  = document.getElementById('swipeColor');
            const wrapper     = document.getElementById('imgWrapper');
            const cityImg     = document.getElementById('cityImg');
            const bgAmbient   = document.getElementById('bgAmbient');
            const cityName    = document.getElementById('cityName');
            const countryName = document.getElementById('countryName');
            const progressTxt = document.getElementById('progressText');
            const progressFill= document.getElementById('progressFill');
            const hintLike    = document.getElementById('hintLike');
            const hintDislike = document.getElementById('hintDislike');
            const tip         = document.getElementById('swipeTip');

            tip.style.display = 'none';

            // Debug-Modus: ?debug in der URL startet die Animation sofort
            if (new URLSearchParams(location.search).has('debug')) {
                showResultLoader('/results');
            }

            let busy = false; // Verhindert Doppel-Clicks während Animation

            // ── Karten-Transition ──────────────────────────────────────────
            async function submitChoice(choice) {
                if (busy) return;
                busy = true;

                localStorage.setItem('swipeTipSeen', '1');
                tip.style.display = 'none';

                const dir = choice === 'like' ? 1 : -1;


// 1. Karte rausfliegen lassen
                wrapper.style.transition = 'transform 0.2s ease, opacity 0.2s ease';
                wrapper.style.transform  = `translateX(${dir * 120}px) rotate(${dir * 8}deg)`;
                wrapper.style.opacity    = '0';

                // 2. Parallel: Fetch nächste Stadt
                let data;
                try {
                    const res = await fetch('/quiz/next', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ choice }),
                    });
                    data = await res.json();
                } catch {
                    // Fallback bei Netzwerkfehler
                    window.location.href = `/quiz?choice=${choice}`;
                    return;
                }

                if (data.redirect) {
                    showResultLoader(data.redirect);
                    return;
                }

                // 3. Bild voraus-laden
                await new Promise(resolve => {
                    const img = new Image();
                    img.onload = img.onerror = resolve;
                    img.src = data.file_path;
                });

                // 4. DOM aktualisieren – unsichtbar von der Gegenseite einblenden
                cityImg.src         = data.file_path;
                bgAmbient.src       = data.file_path;
                cityName.textContent    = data.city_name;
                countryName.textContent = data.country_name;
                progressTxt.textContent = `${data.iteration} / 20`;
                progressFill.style.width= `${(data.iteration / 20) * 100}%`;

                wrapper.style.transition = 'none';
                wrapper.style.transform  = 'translateY(40px) scale(0.9)';
                wrapper.style.opacity    = '0';

                // Reflow erzwingen, dann von unten hochskalieren
                wrapper.offsetHeight;

                wrapper.style.transition = 'transform 0.22s ease-out, opacity 0.22s ease-out';
                wrapper.style.transform  = 'translateY(0) scale(1)';
                wrapper.style.opacity    = '1';

                // Nach Animation wieder freigeben
                setTimeout(() => { busy = false; }, 240);

                // Nächstes Bild im Hintergrund vorausladen
                if (data.prefetch_path) {
                    const prefetch = new Image();
                    prefetch.src = data.prefetch_path;
                }
            }

            // ── Touch-Swipe ────────────────────────────────────────────────
            let startX = 0, startY = 0, currentX = 0, dragging = false, axis = null;
            const THRESHOLD = 60;
            const AXIS_LOCK = 10; // px bis Richtung festgelegt wird

            wrapper.addEventListener('touchstart', e => {
                if (busy) return;
                startX = currentX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
                dragging = true;
                axis = null;
            }, { passive: true });

            wrapper.addEventListener('touchmove', e => {
                if (!dragging) return;
                currentX = e.touches[0].clientX;
                const dx = currentX - startX;
                const dy = e.touches[0].clientY - startY;

                // Achse beim ersten klaren Ausschlag festlegen
                if (!axis && (Math.abs(dx) > AXIS_LOCK || Math.abs(dy) > AXIS_LOCK)) {
                    axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
                }

                if (axis === 'x') {
                    e.preventDefault(); // Scrollen unterdrücken
                    wrapper.style.transition = 'none';
                    wrapper.style.transform  = `translateX(${dx * 0.4}px) rotate(${dx * 0.03}deg)`;
                    hintLike.style.opacity    = dx > 20  ? Math.min((dx  - 20) / 60, 1) : 0;
                    hintDislike.style.opacity = dx < -20 ? Math.min((-dx - 20) / 60, 1) : 0;

                    // Farbverlauf auf der Karte
                    const intensity = Math.min(Math.abs(dx) / 160, 0.75);
                    if (dx > 0) {
                        swipeColor.style.background = 'linear-gradient(to left, rgba(0,229,160,0.7), transparent)';
                    } else {
                        swipeColor.style.background = 'linear-gradient(to right, rgba(255,77,109,0.7), transparent)';
                    }
                    swipeColor.style.opacity = Math.abs(dx) > 10 ? intensity : 0;
                }
                // axis === 'y' → normales Scrollen, keine Karteninteraktion
            }, { passive: false }); // muss non-passive sein für preventDefault

            wrapper.addEventListener('touchend', () => {
                if (!dragging) return;
                dragging = false;
                hintLike.style.opacity = hintDislike.style.opacity = 0;
                swipeColor.style.opacity = 0;

                if (axis === 'x') {
                    const delta = currentX - startX;
                    if (Math.abs(delta) >= THRESHOLD) {
                        submitChoice(delta > 0 ? 'like' : 'dislike');
                    } else {
                        wrapper.style.transition = 'transform 0.2s ease, opacity 0.2s ease';
                        wrapper.style.transform  = 'translateX(0) rotate(0deg)';
                    }
                }
                axis = null;
            });

            // ── Ergebnis-Loader ────────────────────────────────────────────
            function showResultLoader(url) {
                const overlay  = document.getElementById('resultOverlay');
                const status   = document.getElementById('loaderStatus');
                const bar      = document.getElementById('loaderBar');

                const steps = [
                    { text: 'Analysiere deine Präferenzen...',        progress: 25 },
                    { text: 'Durchsuche 190 Städte weltweit...',       progress: 60 },
                    { text: 'Letzte Optimierungen laufen...',           progress: 90 },
                ];

                overlay.classList.add('active');

                let i = 0;
                function nextStep() {
                    if (i < steps.length) {
                        // Fade out → Text wechseln → Fade in
                        status.style.opacity = '0';
                        setTimeout(() => {
                            status.textContent = steps[i].text;
                            bar.style.width    = steps[i].progress + '%';
                            i++;
                            status.style.opacity = '1';
                            setTimeout(nextStep, 2600);
                        }, 500); // warten bis 0.45s Fade-out sicher abgeschlossen
                    } else {
                        // Abschluss
                        bar.style.width = '100%';
                        status.style.opacity = '0';
                        setTimeout(() => { window.location.href = url; }, 650);
                    }
                }

                setTimeout(nextStep, 900);
            }

            // ── Tastatur ───────────────────────────────────────────────────
            document.addEventListener('keydown', e => {
                if (e.key === 'ArrowRight' || e.key === 'l') submitChoice('like');
                if (e.key === 'ArrowLeft'  || e.key === 'h') submitChoice('dislike');
            });
        </script>
    </body>
</html>
